# 部署：./service.sh deploy（首次自动生成 .env 密钥并构建镜像），打开 http://127.0.0.1:8080。
# 改端口或密码时，直接改下面的值。

services:
  gateway:
    image: five-api:latest
    build: .
    restart: always
    # 默认只允许本机访问；需要其他机器直连时去掉 "127.0.0.1:"。
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: five
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-five_password}
      MYSQL_DATABASE: five_api
      REDIS_URL: redis://redis:6379/0
      # 只在首次启动、还没有管理员时创建这个账号，之后改这里不生效。首次登录会强制修改密码。
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
      # 网关本身不保存状态。两把密钥只放在 .env，丢失后数据库里的上游 Key 无法解密。
      SECRET_KEY: ${SECRET_KEY:?先执行 ./service.sh secrets 生成网关密钥}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?先执行 ./service.sh secrets 生成网关密钥}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    stop_grace_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    # 只给本机开发用，外部机器连不上。网关走容器内网，不经过这个端口。
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: five_api
      MYSQL_USER: five
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-five_password}
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # 用 TCP 检查。首次初始化时 MySQL 先起一个不开网络的临时实例，socket 检查会提前通过。
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
