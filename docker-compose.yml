# 部署：./service.sh deploy，打开 http://服务器IP:8080。
# 改端口或密码时，直接改下面的值；数据库密码要在 gateway 和 mysql 两处同时改。

services:
  gateway:
    image: five-api:latest
    build: .
    restart: always
    ports:
      - "8080:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
      MYSQL_DATABASE: five_api
      REDIS_URL: redis://redis:6379/0
      # 只在首次启动、还没有管理员时创建这个账号，之后改这里不生效。首次登录会强制修改密码。
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
      # 可选，各填至少 32 位且互不相同的随机串。不填时登录在重启后失效，上游 Key 用内置公开密钥加密。
      # 已保存渠道后再设 ENCRYPTION_KEY，先执行 python -m app.migrate_secrets --from-default 重新加密。
      # SECRET_KEY: random_string
      # ENCRYPTION_KEY: random_string
    stop_grace_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    # 只给本机开发用，外部机器连不上。网关走容器内网，不经过这个端口。
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: five_api
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # 用 TCP 检查。首次初始化时 MySQL 先起一个不开网络的临时实例，socket 检查会提前通过。
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
