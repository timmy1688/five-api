# 启动：docker compose up -d
# 打开 http://localhost ，账号 admin / admin123，首次登录会要求改密码
# 改端口或密码时，直接改下面的值。

services:
  gateway:
    # 有发布镜像时直接拉取；拉不到就用本地源码构建
    image: ghcr.io/timmy1688/five-api:latest
    build: .
    restart: always
    ports:
      - "80:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
      MYSQL_DATABASE: five_api
      REDIS_URL: redis://redis:6379/0
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
    stop_grace_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    # 只给本机开发用，外部机器连不上。网关走容器内网，不经过这个端口。
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: five_api
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # 用 TCP 检查。首次初始化时 MySQL 先起一个不开网络的临时实例，socket 检查会提前通过。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
