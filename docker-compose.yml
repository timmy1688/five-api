# 启动：docker compose up -d
# 打开 http://localhost ，账号 admin / admin123
# 改端口或密码时，直接改下面的值。

services:
  gateway:
    build: .
    restart: always
    ports:
      - "80:8000"
    volumes:
      - ./data:/data
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
      MYSQL_DATABASE: five_api
      REDIS_URL: redis://redis:6379/0
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
    depends_on:
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: five_api
      MYSQL_USER: five
      MYSQL_PASSWORD: five_password
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
