[project]
name = "five-api"
version = "0.1.0"
description = "Simplified AI API Gateway"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.aerich]
tortoise_orm = "app.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "."

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
