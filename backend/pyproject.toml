[project]
name = "five-api"
version = "0.4.0"
description = "Simplified AI API Gateway"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.aerich]
tortoise_orm = "app.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "."

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "regression: protocol isolation, failover, billing, and admin behavior",
    "load: concurrent request and security-scan pressure",
    "integration: real MySQL, Redis and HTTP; requires an explicit disposable database",
]
