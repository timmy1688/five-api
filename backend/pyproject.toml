[project]
name = "five-api"
version = "0.1.0"
description = "Simplified AI API Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tortoise-orm[asyncmy]>=0.22.0",
    "aerich>=0.8.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
]

[tool.aerich]
tortoise_orm = "app.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
